name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.claude'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.agents/**'
      - '.claude'
      - '.claude/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libssh2-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential \
            curl \
            wget \
            file \
            cmake \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare development version
        id: development
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version=$(node .github/scripts/development-update.mjs version \
              --base-version "${{ steps.version.outputs.version }}" \
              --run-number "$GITHUB_RUN_NUMBER")
            echo "version=$version" >> "$GITHUB_OUTPUT"
            tauri_config=$(node .github/scripts/development-update.mjs config \
              --base-version "${{ steps.version.outputs.version }}" \
              --run-number "$GITHUB_RUN_NUMBER")
            echo "tauri_config=$tauri_config" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo 'tauri_config={}' >> "$GITHUB_OUTPUT"
          fi

      - name: Get short commit hash
        id: hash
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_HASH: ${{ !startsWith(github.ref, 'refs/tags/v') && steps.hash.outputs.short || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '' }}
          releaseBody: 'See the assets below to download and install GitUI for your platform.'
          releaseDraft: true
          prerelease: false
          args: >-
            --target ${{ matrix.target }}
            --config '${{ steps.development.outputs.tauri_config }}'

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ steps.development.outputs.version }}-${{ steps.hash.outputs.short }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 7

  publish-development-update:
    name: Publish development update
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download signed updater artifacts
        uses: actions/download-artifact@v4
        with:
          path: development-artifacts

      - name: Create development update manifest
        shell: bash
        run: |
          node .github/scripts/development-update.mjs manifest \
            --artifacts-dir development-artifacts \
            --output-dir development-update \
            --base-version "$(node -p "require('./package.json').version")" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --sha "$GITHUB_SHA" \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload development update site
        uses: actions/upload-pages-artifact@v3
        with:
          path: development-update

      - name: Deploy rolling development snapshot
        id: deployment
        uses: actions/deploy-pages@v4
